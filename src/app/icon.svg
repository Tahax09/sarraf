<!--
  The Saraf mark on its own — the same artwork as the plate in src/logo/LogoHC.svg,
  cropped to its 32×32 box. The wordmark is dropped deliberately: at tab size it
  is unreadable, and the plate carries the brand colours by itself.

  One file for both themes. The plate is brand dark with the blue and green
  arrows on top, which holds its contrast against a light and a dark tab strip
  alike, so there is no theme-conditional favicon to keep in sync.
-->
