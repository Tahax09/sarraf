name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the pipeline after a dependency advisory lands
  # without pushing an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app refuses to boot without this (src/lib/api/client.ts). CI never
  # contacts a real backend: fixtures answer every request, and the value only
  # has to be a well-formed URL — which is also what the CSP's connect-src is
  # derived from.
  NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
  NEXT_PUBLIC_API_MODE: fixtures
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every gate runs even if an earlier one failed, so one push gives the
      # whole picture instead of one error at a time.
      #
      # Secrets first: it is the cheapest check and the only one whose failure
      # means "stop and rotate a credential" rather than "fix the code".
      - name: Secret scan
        run: npm run check:secrets

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # Cycles, layering, and production code importing tests. None of these
      # are visible in a diff, which is why they are a build step and not a
      # review convention.
      - name: Architecture rules
        if: ${{ !cancelled() }}
        run: npm run check:architecture

      # Zero, not four. The allowance existed because five React Compiler
      # bail-outs were already in the tree; they were fixed at the source
      # (`form.watch()` → `useWatch`), so a warning now means a new one.
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint -- --max-warnings=0

      # Coverage rather than a plain run: the thresholds in jest.config.ts are a
      # ratchet, and a ratchet nobody turns is a comment.
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:coverage -- --ci

      # Coverage HTML is what a reviewer wants when the ratchet fails, and it
      # is useless after the runner is torn down.
      - name: Coverage report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # `build:release` rather than `build`: it stamps the version, commit and
      # build time the footer and the diagnostics card read. A CI build that
      # reported itself as 0.0.0-dev would make the whole mechanism a lie.
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build:release
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_ENVIRONMENT: ci

      - name: Translation catalogues agree
        if: ${{ !cancelled() }}
        run: npm run check:messages

      # Composition, not per-route weight — that is the `performance` job
      # below. Published on every run, not only failures: the value of a size
      # table is the comparison with last week's.
      - name: Bundle report
        if: ${{ !cancelled() }}
        run: npm run bundle:report -- --json bundle-report.json

      - name: Bundle report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: bundle-report.json
          retention-days: 30

  e2e:
    name: Playwright (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only: both projects in playwright.config.ts are Chrome-based.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=desktop --project=mobile

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility (axe, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Its own job, not a step in `e2e`: an accessibility regression and a
      # broken transfer flow are different failures with different owners, and
      # a red X that says which one it is saves the reader a log dive. Runs the
      # whole route table in both catalogues — see e2e/a11y.spec.ts for what
      # axe does and does not certify.
      - run: npm run test:e2e:a11y

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-a11y
          path: playwright-report/
          retention-days: 7

  performance:
    name: JavaScript budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Builds, serves the build, drives a real browser, and fails if a route
      # transfers more JavaScript than its ceiling. Measured on a production
      # build because a dev-server number is a number about the dev server.
      - run: npm run perf:budget

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report-performance
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # High and critical fail the build. Moderate and low are reported in the
      # log: a transitive advisory with no upgrade path should not block a
      # deploy that fixes something else.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: npm audit (full report)
        if: ${{ !cancelled() }}
        run: npm audit || true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Measured on /login: the only route reachable without a session, and the
      # one that carries the first paint every user pays for.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.x autorun
