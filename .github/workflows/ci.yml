name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the pipeline after a dependency advisory lands
  # without pushing an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The app refuses to boot without this (src/lib/api/client.ts). CI never
  # contacts a real backend: fixtures answer every request, and the value only
  # has to be a well-formed URL — which is also what the CSP's connect-src is
  # derived from.
  NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
  NEXT_PUBLIC_API_MODE: fixtures
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Four gates, each run even if an earlier one failed, so one push gives
      # the whole picture instead of one error at a time.
      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint -- --max-warnings=4

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test -- --ci

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Translation catalogues agree
        if: ${{ !cancelled() }}
        run: npm run check:messages

  e2e:
    name: Playwright (desktop + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only: both projects in playwright.config.ts are Chrome-based.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # High and critical fail the build. Moderate and low are reported in the
      # log: a transitive advisory with no upgrade path should not block a
      # deploy that fixes something else.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high

      - name: npm audit (full report)
        if: ${{ !cancelled() }}
        run: npm audit || true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Measured on /login: the only route reachable without a session, and the
      # one that carries the first paint every user pays for.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.x autorun
